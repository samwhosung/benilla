[package]
name = "benilla-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-free WoW UI engine core: TOC and FrameXML parsing, templates, anchors, z-order"

[lints]
workspace = true

[features]
# `test_support`: the geometry comparisons other crates' tests check the UI with.
test-support = []

[dependencies]
roxmltree = "0.20"
# The script host's Lua: benilla's own interpreter, through a crate that answers to the name
# `mlua` (`src/lib.rs`).
benilla-mlua = { path = "../benilla-mlua" }
