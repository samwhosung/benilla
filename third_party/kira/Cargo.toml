[package]
edition = "2024"
name = "kira"
version = "0.12.4"
authors = ["Andrew Minnich <aminnich3@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Expressive audio library for games"
readme = "README.md"
keywords = [
    "gamedev",
    "audio",
    "music",
]
categories = [
    "game-development",
    "multimedia::audio",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tesselode/kira"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

